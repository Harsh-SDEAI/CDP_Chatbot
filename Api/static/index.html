<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDP Admin — Content Manager</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-hover: #232736;
      --border: #2e3348;
      --primary: #6c63ff;
      --primary-hover: #5a52e0;
      --text: #e4e6f0;
      --text-muted: #8b8fa3;
      --success: #2dd4a8;
      --danger: #ff6b6b;
      --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ───────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header h1 { font-size: 1.25rem; font-weight: 600; }
    .upload-btn {
      padding: 10px 22px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .upload-btn:hover { background: var(--primary-hover); }

    /* ── File List ─────────────────────────────── */
    .container { max-width: 960px; margin: 32px auto; padding: 0 24px; }

    .file-list { display: flex; flex-direction: column; gap: 10px; }

    .file-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: background 0.15s;
    }
    .file-card:hover { background: var(--surface-hover); }

    .file-info { display: flex; flex-direction: column; gap: 4px; }
    .file-name { font-weight: 600; font-size: 0.95rem; }
    .file-meta { font-size: 0.8rem; color: var(--text-muted); }

    .file-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-uploaded { background: rgba(45,212,168,0.15); color: var(--success); }
    .badge-scraped  { background: rgba(108,99,255,0.15); color: var(--primary); }

    .file-actions { display: flex; gap: 8px; align-items: center; }

    .delete-btn {
      background: none;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .delete-btn:hover { background: var(--danger); color: #fff; }

    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* ── Modal Overlay ────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 460px;
      max-width: 92vw;
      padding: 28px;
      position: relative;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
    }
    .modal-close:hover { color: var(--text); }

    .modal h2 {
      font-size: 1.15rem;
      margin-bottom: 22px;
      font-weight: 600;
    }

    /* ── Tab Buttons in Modal ─────────────────── */
    .tab-row {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: var(--bg);
      color: var(--text-muted);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-btn:hover { border-color: var(--primary); color: var(--text); }
    .tab-btn.active {
      border-color: var(--primary);
      background: rgba(108,99,255,0.1);
      color: var(--primary);
    }

    /* ── Tab Content ──────────────────────────── */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* File Upload Tab */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 36px 20px;
      text-align: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--primary);
      background: rgba(108,99,255,0.05);
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .drop-zone p { font-size: 0.9rem; }
    .drop-zone .hint { font-size: 0.78rem; margin-top: 6px; }

    /* URL Tab */
    .url-row {
      display: flex;
      gap: 10px;
    }
    .url-input {
      flex: 1;
      padding: 11px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    .url-input:focus { border-color: var(--primary); }
    .url-input::placeholder { color: var(--text-muted); }

    .fetch-btn {
      padding: 11px 20px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .fetch-btn:hover { background: var(--primary-hover); }
    .fetch-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Progress / Status ────────────────────── */
    .status-bar {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      display: none;
    }
    .status-bar.active { display: block; }
    .status-bar.loading {
      background: rgba(108,99,255,0.1);
      color: var(--primary);
      border: 1px solid rgba(108,99,255,0.3);
    }
    .status-bar.success {
      background: rgba(45,212,168,0.1);
      color: var(--success);
      border: 1px solid rgba(45,212,168,0.3);
    }
    .status-bar.error {
      background: rgba(255,107,107,0.1);
      color: var(--danger);
      border: 1px solid rgba(255,107,107,0.3);
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--primary);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>CDP Content Manager</h1>
    <button class="upload-btn" id="openModal">+ Upload</button>
  </div>

  <!-- File List -->
  <div class="container">
    <div class="file-list" id="fileList">
      <div class="empty-state" id="emptyState">No files uploaded yet. Click <strong>+ Upload</strong> to get started.</div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="closeModal">&times;</button>
      <h2>Add Content</h2>

      <!-- Tabs -->
      <div class="tab-row">
        <button class="tab-btn active" data-tab="file">File Upload</button>
        <button class="tab-btn" data-tab="url">URL</button>
      </div>

      <!-- File Upload Tab -->
      <div class="tab-content active" id="tab-file">
        <div class="drop-zone" id="dropZone">
          <input type="file" id="fileInput" accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.webp,.bmp,.tiff,.tif" />
          <p>Click or drag a file here</p>
          <p class="hint">Supports PDF, Images, TXT, MD</p>
        </div>
        <div class="status-bar" id="fileStatus"></div>
      </div>

      <!-- URL Tab -->
      <div class="tab-content" id="tab-url">
        <div class="url-row">
          <input type="text" class="url-input" id="urlInput" placeholder="https://example.com/page" />
          <button class="fetch-btn" id="fetchBtn">Fetch Info</button>
        </div>
        <div class="status-bar" id="urlStatus"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    // ── DOM refs ─────────────────────────────────
    const openModal    = document.getElementById("openModal");
    const closeModal   = document.getElementById("closeModal");
    const overlay      = document.getElementById("modalOverlay");
    const tabBtns      = document.querySelectorAll(".tab-btn");
    const fileInput    = document.getElementById("fileInput");
    const dropZone     = document.getElementById("dropZone");
    const fileStatus   = document.getElementById("fileStatus");
    const urlInput     = document.getElementById("urlInput");
    const fetchBtn     = document.getElementById("fetchBtn");
    const urlStatus    = document.getElementById("urlStatus");
    const fileList     = document.getElementById("fileList");
    const emptyState   = document.getElementById("emptyState");

    // ── Modal open / close ───────────────────────
    openModal.addEventListener("click", () => {
      overlay.classList.add("active");
      resetModal();
    });
    closeModal.addEventListener("click", closeModalFn);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModalFn(); });

    function closeModalFn() {
      overlay.classList.remove("active");
      resetModal();
    }

    function resetModal() {
      fileInput.value = "";
      urlInput.value  = "";
      hideStatus(fileStatus);
      hideStatus(urlStatus);
    }

    // ── Tab switching ────────────────────────────
    tabBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        tabBtns.forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    // ── Status helpers ───────────────────────────
    function showStatus(el, type, msg) {
      el.className = "status-bar active " + type;
      el.innerHTML = (type === "loading" ? '<span class="spinner"></span>' : "") + msg;
    }
    function hideStatus(el) {
      el.className = "status-bar";
      el.innerHTML = "";
    }

    // ── Drag & Drop ──────────────────────────────
    dropZone.addEventListener("dragover",  (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
    dropZone.addEventListener("dragleave", ()  => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
    });

    // ── File Upload ──────────────────────────────
    fileInput.addEventListener("change", () => {
      if (fileInput.files.length) uploadFile(fileInput.files[0]);
    });

    async function uploadFile(file) {
      showStatus(fileStatus, "loading", `Processing <strong>${file.name}</strong> — converting to markdown...`);
      const form = new FormData();
      form.append("file", file);

      try {
        const res = await fetch(API_BASE + "/upload", { method: "POST", body: form });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Upload failed");
        }
        const data = await res.json();
        showStatus(fileStatus, "success", `Saved as <strong>${data.filename}</strong>`);
        loadFiles();
      } catch (e) {
        showStatus(fileStatus, "error", e.message);
      }
    }

    // ── URL Scrape ───────────────────────────────
    fetchBtn.addEventListener("click", scrapeUrl);
    urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") scrapeUrl(); });

    async function scrapeUrl() {
      const url = urlInput.value.trim();
      if (!url) return;
      showStatus(urlStatus, "loading", `Fetching &amp; converting <strong>${url}</strong> to markdown...`);
      fetchBtn.disabled = true;

      try {
        const res = await fetch(API_BASE + "/scrape", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Scrape failed");
        }
        const data = await res.json();
        showStatus(urlStatus, "success", `Saved as <strong>${data.filename}</strong>`);
        loadFiles();
      } catch (e) {
        showStatus(urlStatus, "error", e.message);
      } finally {
        fetchBtn.disabled = false;
      }
    }

    // ── File List ────────────────────────────────
    async function loadFiles() {
      try {
        const res  = await fetch(API_BASE + "/files");
        const data = await res.json();
        renderFiles(data.files || []);
      } catch (e) {
        console.error("Failed to load files:", e);
      }
    }

    function renderFiles(files) {
      if (!files.length) {
        fileList.innerHTML = '<div class="empty-state">No files uploaded yet. Click <strong>+ Upload</strong> to get started.</div>';
        return;
      }

      fileList.innerHTML = files.map(f => `
        <div class="file-card" data-id="${f.file_id}">
          <div class="file-info">
            <span class="file-name">${escHtml(f.filename)}</span>
            <span class="file-meta">
              ${f.type === "scraped" ? "Scraped" : "Uploaded"}
              ${f.url ? " from " + escHtml(f.url) : ""}
              — ${formatSize(f.size_bytes)}
              ${f.page_count ? " — " + f.page_count + " page(s)" : ""}
            </span>
          </div>
          <div class="file-actions">
            <span class="file-badge ${f.type === "scraped" ? "badge-scraped" : "badge-uploaded"}">${f.type}</span>
            <button class="delete-btn" onclick="deleteFile('${f.file_id}')">Delete</button>
          </div>
        </div>
      `).join("");
    }

    async function deleteFile(fileId) {
      if (!confirm("Delete this file?")) return;
      try {
        await fetch(API_BASE + "/content/" + fileId, { method: "DELETE" });
        loadFiles();
      } catch (e) {
        alert("Delete failed: " + e.message);
      }
    }

    function formatSize(bytes) {
      if (!bytes) return "—";
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / 1048576).toFixed(1) + " MB";
    }

    function escHtml(s) {
      const d = document.createElement("div");
      d.textContent = s || "";
      return d.innerHTML;
    }

    // ── Init ─────────────────────────────────────
    loadFiles();
  </script>
</body>
</html>
