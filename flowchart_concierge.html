<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Concierge API - Flow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f8f9fb;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1a1a2e;
        }

        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 32px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }

        .col { display: flex; flex-direction: column; align-items: center; }

        .label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            padding: 8px 28px;
            border-radius: 24px;
            margin-bottom: 20px;
        }
        .label.green { background: #10b981; }
        .label.blue  { background: #3b82f6; }

        .box {
            width: 260px;
            padding: 16px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .line {
            width: 2px;
            height: 16px;
            background: #d1d5db;
        }
    </style>
</head>
<body>

    <h1>Concierge API</h1>

    <div class="grid">

        <div class="col">
            <div class="label green">Scrape &amp; Monitor</div>
            <div class="box">Fetch Webpage</div>
            <div class="line"></div>
            <div class="box">Clean HTML</div>
            <div class="line"></div>
            <div class="box">Convert to Markdown</div>
            <div class="line"></div>
            <div class="box">SHA-256 Hash Check</div>
            <div class="line"></div>
            <div class="box">Save to Disk</div>
            <div class="line"></div>
            <div class="box">Auto-Monitor (1h)</div>
        </div>

        <div class="col">
            <div class="label blue">RAG Query</div>
            <div class="box">User Question</div>
            <div class="line"></div>
            <div class="box">Generate Embedding</div>
            <div class="line"></div>
            <div class="box">Search FAISS</div>
            <div class="line"></div>
            <div class="box">Build Context</div>
            <div class="line"></div>
            <div class="box">Send to GPT</div>
            <div class="line"></div>
            <div class="box">Return Answer</div>
        </div>

    </div>

</body>
</html>
